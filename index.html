<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>观鸟打卡</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage">
  <div class="phone" id="phone">

    <!-- ============ 地图 ============ -->
    <section class="screen map-screen is-active" data-screen="map">
      <div class="map-bg"></div>
      <div class="map-tint"></div>

      <header class="topbar">
        <button class="round-btn" aria-label="菜单"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div class="greet">
          <h1>Let's go <em>birding</em></h1>
          <p class="date"><svg class="ic sm"><use href="#i-cal"/></svg>10 Oct · 北京昌平</p>
        </div>
        <button class="round-btn has-dot" aria-label="通知"><svg class="ic"><use href="#i-bell"/></svg></button>
        <img class="mini-avatar" src="assets/avatar.png" alt="">
      </header>

      <div class="chips" id="mapChips">
        <button class="chip is-on" data-k="all"><svg class="ic sm"><use href="#i-tree"/></svg>全部</button>
        <button class="chip" data-k="water"><svg class="ic sm"><use href="#i-wave"/></svg>湿地</button>
        <button class="chip" data-k="forest"><svg class="ic sm"><use href="#i-tree"/></svg>森林</button>
        <button class="chip" data-k="city"><svg class="ic sm"><use href="#i-bldg"/></svg>城市</button>
      </div>

      <div class="pins" id="pins"></div>

      <article class="spot-card" id="spotCard">
        <div class="spot-info">
          <span class="tag" id="spotTag">鸟类卡</span>
          <h2 id="spotName">水鸟爱好者</h2>
          <p class="muted">任务介绍……</p>
          <p class="loc"><svg class="ic sm"><use href="#i-pin"/></svg><span>北京市，昌平区，……</span></p>
        </div>
        <div class="spot-photo"><img id="spotImg" src="assets/bird-round.png" alt=""></div>
        <button class="go-btn" id="spotGo">去打卡</button>
      </article>
    </section>

    <!-- ============ 任务 ============ -->
    <section class="screen task-screen" data-screen="tasks">
      <div class="scroll">
        <div class="progress-card">
          <div>
            <p class="eyebrow">TODAY</p>
            <h2>任务完成情况</h2>
            <p class="sub" id="progressSub">2 / 5 已完成</p>
          </div>
          <div class="ring">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="50" class="ring-bg"/>
              <circle cx="60" cy="60" r="50" class="ring-fg" id="ringFg" transform="rotate(-90 60 60)"/>
            </svg>
            <b id="ringTxt">40%</b>
          </div>
          <svg class="bird-deco" viewBox="0 0 60 40"><path d="M2 20c10-14 22-14 28 0 6-14 18-14 28 0-10-4-20-2-28 8-8-10-18-12-28-8z" fill="currentColor"/></svg>
        </div>

        <div class="chips tabs" id="taskTabs">
          <button class="chip is-on" data-k="all">全部</button>
          <button class="chip mint" data-k="done">已完成</button>
          <button class="chip sun" data-k="doing">进行中</button>
        </div>

        <ul class="task-list" id="taskList"></ul>
      </div>
    </section>

    <!-- ============ 图鉴 ============ -->
    <section class="screen cards-screen" data-screen="cards">
      <div class="scroll">
        <div class="cat-row" id="catRow">
          <button class="cat" data-k="habitat"><span><svg class="ic"><use href="#i-tree"/></svg></span>栖息地卡</button>
          <button class="cat" data-k="bird"><span><svg class="ic"><use href="#i-bird"/></svg></span>鸟类卡</button>
          <button class="cat" data-k="crisis"><span><svg class="ic"><use href="#i-factory"/></svg></span>生态危机</button>
          <button class="cat is-on" data-k="tool"><span><svg class="ic"><use href="#i-tools"/></svg></span>道具卡</button>
        </div>
        <div class="card-grid" id="cardGrid"></div>
      </div>
    </section>

    <!-- ============ 我的 ============ -->
    <section class="screen me-screen" data-screen="me">
      <div class="scroll">
        <div class="me-head">
          <div class="avatar"><img src="assets/avatar.png" alt=""></div>
          <h2>用户名称</h2>
          <p class="muted">Lv.3 · 湿地观察员</p>
        </div>

        <h3 class="sec">小组名字</h3>
        <div class="team">
          <button class="member add" aria-label="邀请成员"><i><svg class="ic"><use href="#i-plus"/></svg></i></button>
          <div class="member"><img src="assets/member.png" alt=""><span>组员1</span></div>
          <div class="member"><img src="assets/member.png" alt=""><span>组员2</span></div>
          <div class="member"><img src="assets/member.png" alt=""><span>组员3</span></div>
        </div>

        <h3 class="sec">获得勋章</h3>
        <div class="medals"><img src="assets/medals.svg" alt="勋章"></div>
      </div>
    </section>

    <!-- ============ 扫描 ============ -->
    <section class="screen scan-screen" data-screen="scan">
      <img class="scan-photo" src="assets/scan-photo.png" alt="">
      <div class="scan-dim"></div>
      <button class="back-btn" data-back aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="viewfinder"><i></i><i></i><i></i><i></i><div class="scanline"></div></div>
      <p class="scan-hint">将鸟类雕塑放入取景框</p>
      <div class="found-card" id="foundCard">
        <div class="thumb"><svg class="ic xl"><use href="#i-image"/></svg></div>
        <div>
          <span class="tag">道具卡</span>
          <h3>生态循环</h3>
        </div>
        <button class="next-btn" id="foundNext" aria-label="查看"><svg class="ic"><use href="#i-chev"/></svg></button>
      </div>
    </section>

    <!-- ============ 卡片详情 ============ -->
    <section class="screen detail-screen" data-screen="detail">
      <img class="scan-photo" src="assets/scan-photo.png" alt="">
      <div class="scan-dim strong"></div>
      <button class="back-btn" data-back aria-label="返回"><svg class="ic"><use href="#i-back"/></svg></button>
      <article class="big-card">
        <div class="big-inner">
          <span class="tag">道具卡</span>
          <h2 id="detailTitle">生态循环</h2>
          <div class="bar mint-bar"></div>
          <div class="bar short"></div>
          <div class="func">
            <h4>功能</h4>
            <div class="line"><i></i><b></b></div>
            <div class="line"><i></i><b></b></div>
            <div class="line"><i></i><b></b></div>
          </div>
        </div>
      </article>
      <button class="claim" id="claimBtn">领取</button>
    </section>

    <!-- ============ 底部导航 ============ -->
    <nav class="tabbar" id="tabbar">
      <button data-tab="map" class="is-on"><svg class="ic"><use href="#i-map"/></svg><span>地图</span></button>
      <button data-tab="tasks"><svg class="ic"><use href="#i-task"/></svg><span>任务</span></button>
      <span class="gap"></span>
      <button data-tab="cards"><svg class="ic"><use href="#i-grid"/></svg><span>图鉴</span></button>
      <button data-tab="me"><svg class="ic"><use href="#i-people"/></svg><span>我的</span></button>
      <button class="fab" id="fab" aria-label="扫描"><svg class="ic xl"><use href="#i-plus"/></svg></button>
    </nav>
  </div>
</main>

<!-- ============ 图标 ============ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="wobble" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M5 8h14M5 16h9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17V11a6 6 0 1 1 12 0v6l1.5 2h-15zM10 21h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3v4M15 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M12 3c4 0 7 3 7 6.500 0 2-1 3.500-2.500 4.500 1 .8 1.500 1.700 1.500 3 0 2-2 3-4.500 3H12m0-17C8 3 5 6 5 9.500c0 2 1 3.500 2.500 4.500C6.500 14.800 6 15.700 6 17c0 2 2 3 4.500 3H12m0-17v17" fill="none" stroke="currentColor" stroke-width="1.800" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-bldg" viewBox="0 0 24 24"><path d="M5 20V8l7-4 7 4v12zM9 11h2m2 0h2M9 15h2m2 0h2" fill="none" stroke="currentColor" stroke-width="1.900" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.200 7-11.500a7 7 0 1 0-14 0C5 14.800 12 21 12 21z" fill="currentColor"/><circle cx="12" cy="9.500" r="2.500" fill="#fff"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M3 6.500l6-2.500 6 2.500 6-2.500v13.500l-6 2.500-6-2.500-6 2.500zM9 4v13.500M15 6.500V20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-task" viewBox="0 0 24 24"><rect x="5" y="3.500" width="14" height="17" rx="3.500" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.500 9.500l1.800 1.800 3.200-3.300M9 15.500h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="4" width="7" height="7" rx="2" fill="currentColor"/><rect x="4" y="13" width="7" height="7" rx="2" fill="currentColor"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
    <symbol id="i-people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500" fill="currentColor"/><path d="M2.500 19c0-3.500 3-5.500 6.500-5.500s6.500 2 6.500 5.500z" fill="currentColor"/><circle cx="17" cy="9" r="2.600" fill="currentColor" opacity=".7"/><path d="M16 14c3 0 5.500 1.500 5.500 4.500H17.500c0-1.800-.6-3.200-1.500-4.500z" fill="currentColor" opacity=".7"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.600" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-image" viewBox="0 0 48 48"><rect x="7" y="9" width="34" height="30" rx="8" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="21" r="3.500" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 35l10-8 8 6 6-5 9 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></symbol>
    <symbol id="i-bird" viewBox="0 0 24 24"><path d="M20 5c-1 .2-2 .8-2.600 1.600C16 5.400 13.500 5 11.500 6 9 7.300 8.500 10 8.500 12 6 13 4 15.500 3 18c3 0 5-.8 6.500-2 3 0 6.500-1.500 8-5.500l2.500-1-1.800-1.200C18.700 7 19.500 6 20 5z" fill="currentColor"/></symbol>
    <symbol id="i-factory" viewBox="0 0 24 24"><path d="M3 20V11l6 3v-3l6 3V6h3v14zM6 5.500c1 0 1-1.500 2-1.500M11 7c1 0 1-1.500 2-1.500" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></symbol>
    <symbol id="i-tools" viewBox="0 0 24 24"><path d="M14.500 4.500a4.500 4.500 0 0 0-4 6.200L4 17.200 6.800 20l6.500-6.500a4.500 4.500 0 0 0 6.200-4l-3 3-2.500-.5-.5-2.500z" fill="currentColor"/></symbol>
  </defs>
</svg>
<script src="app.js"></script>
</body>
</html>
